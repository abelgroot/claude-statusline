# Claude Code <-> tmux integration for the Catppuccin theme (catppuccin/tmux v2.x, tested on v2.1.2, mocha, "rounded" windows).
# Source this AFTER the catppuccin plugin is loaded:   source-file ~/.config/tmux/claude-catppuccin.conf
# Needs ~/.claude/tmux-claude.sh (see README).

# 1) Pill shown in the status bar: "✻ So5.5·M  S ████ 14%  W ████ 55%"
set -gF @catppuccin_status_claude "#[fg=#{@thm_mauve}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_mauve}]✻ #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}]"
set -ag  @catppuccin_status_claude " #(~/.claude/tmux-claude.sh bars '#{pane_current_path}')"
set -agF @catppuccin_status_claude "#[fg=#{E:@catppuccin_status_module_text_bg}]#{@catppuccin_status_right_separator}"

# 2) Window names: "✻ foldername" while the window runs Claude Code, otherwise the normal window name
set -g @catppuccin_window_default_text "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"
set -g @catppuccin_window_text         "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"
set -g @catppuccin_window_current_text "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"

# 3) Polling: tmux re-runs the script this often (seconds). The script only reads small cache files.
set -g status-interval 5
set -g status-right-length 160

# 4) Add the pill to your status-right (only shown while the active pane runs Claude Code), e.g.:
#    set -g status-right "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{E:@catppuccin_status_claude},}#{E:@catppuccin_status_application}"
#    (put it first/last/wherever you like among your other catppuccin modules)
