# Claude Code <-> tmux integration for ANY tmux theme (no Catppuccin needed).
# Source it from ~/.tmux.conf:   source-file ~/.config/tmux/claude-plain.conf
# Needs ~/.claude/tmux-claude.sh (see README).

# --- optional script settings (defaults shown) ---
# set -g @claude_branch on          # show git branch
# set -g @claude_reset on           # show reset countdowns
# set -g @claude_bar_width 4        # bar width
# set -g @claude_c_fg "#e0e0e0"     # text      (also @claude_c_sub, _empty, _ok, _warn, _bad)

# The pill: accent-colored "✻" block + dark text block. Change the colors to match your theme.
set -g @claude_status "#[fg=#1e1e2e,bg=#cba6f7,bold] ✻ #[fg=#e0e0e0,bg=#313244] #(~/.claude/tmux-claude.sh bars '#{pane_current_path}') #[default]"

set -g status-interval 5          # polling: how often tmux re-runs the script (seconds)
set -g status-right-length 200

# Add it to YOUR status-right (shown only while the active pane runs Claude Code), for example:
#   set -g status-right "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{E:@claude_status},} #{status-right}"
# NB: put this line after your theme sets status-right, or paste your existing status-right in place of #{status-right}.

# Window names: "✻ folder" while the window runs Claude Code (adapt to your theme's window-status-format), e.g.:
#   set -g window-status-format         " #I #{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W} "
#   set -g window-status-current-format " #I #{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W} "

# Optional key: prefix + B shows/hides Claude's own status bar
bind B run-shell "~/.claude/toggle-statusbar.sh toggle >/dev/null"
