# ~/.tmux.conf

# Set default term to xterm
set -g default-terminal xterm-256color

set -g prefix C-u
unbind C-b
bind-key C-u send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf

# resize: nvim windows when the pane runs nvim (it gets <A-key>), tmux panes otherwise
bind j if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys M-j" "resize-pane -D 5"
bind k if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys M-k" "resize-pane -U 5"
bind l if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys M-l" "resize-pane -R 5"
bind h if-shell "ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'" "send-keys M-h" "resize-pane -L 5"

bind -r m resize-pane -Z

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"
set -g @catppuccin_window_text "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"
set -g @catppuccin_window_current_text "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},✻ #{b:pane_current_path},#W}"



# Claude usage module (Catppuccin-styled, built by hand). Shown only while the active pane is running Claude Code.
set -gF @catppuccin_status_claude "#[fg=#{@thm_mauve}]#{@catppuccin_status_left_separator}#[fg=#{@thm_crust},bg=#{@thm_mauve}]✻ #{@catppuccin_status_middle_separator}#[fg=#{@thm_fg},bg=#{E:@catppuccin_status_module_text_bg}]"
set -ag @catppuccin_status_claude " #(~/.claude/tmux-claude.sh bars '#{pane_current_path}')"
set -agF @catppuccin_status_claude "#[fg=#{E:@catppuccin_status_module_text_bg}]#{@catppuccin_status_right_separator}"

# Make the status line pretty and add some modules
set -g status-right-length 160
set -g status-interval 5
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{E:@catppuccin_status_claude},}#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Load catppuccin
run '~/.config/tmux/plugins/tpm/tpm'
# For TPM, instead use `run ~/.config/tmux/plugins/tmux/catppuccin.tmux`
set -g default-command "${SHELL}"

